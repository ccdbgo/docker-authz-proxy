# docker-authz-proxy 授权策略配置
# 版本：1
#
# 设计原则：
#   - 白名单模式（default_action: allow）：默认允许所有操作，通过 deny_rules 禁止特定操作
#   - 所有用户（含 root）均受此策略约束，无豁免
#
# 用户角色说明：
#   root          - 超级管理员，无限制（不配置 deny_rules）
#   test-sudo     - sudo 组成员，可做大多数操作，禁止 push/swarm/plugin/secret/config
#   test-docker-g - docker 组成员，受限用户，禁止 build/push/commit/load/save/swarm/plugin/secret/config
#   bob           - 普通开发者，禁止 exec/build/push/commit/load/save/swarm/plugin/secret/config
#   alice         - 受限用户，禁止 ps/exec/build/push/commit/load/save/prune/swarm/plugin/secret/config
#
# ⚠️  安全提示：容器创建参数的安全风险
# ─────────────────────────────────────────────────────────────────────────────
# 本代理通过 deny_rules 控制 Docker 操作（如 ps/exec/build 等），但容器创建时
# 的参数（--privileged、--pid=host、--net=host、--cap-add 等）属于
# create_container 操作的一部分，不在上述操作分类中单独控制。
#
# 如需限制受信任度较低的用户使用高危参数，请在 quota.yaml 中配合配额策略，
# 或在此处通过 deny_rules 禁止 create_container 操作（即禁止该用户创建容器）。
#
# 常见高危参数及风险说明：
#   --privileged          完全绕过容器隔离，可访问宿主机所有设备，风险极高
#   --pid=host            共享宿主机 PID 命名空间，可看到/操作宿主机进程
#   --net=host            共享宿主机网络栈，可监听宿主机端口
#   --ipc=host            共享宿主机 IPC 命名空间
#   --cap-add SYS_ADMIN   添加高权限 capability，接近特权容器
#   --cap-add NET_ADMIN   可修改宿主机网络配置
#   --userns=host         禁用用户命名空间隔离
#
# 建议：对于不受信任的普通用户（如 alice 类角色），应在 deny_rules 中
# 禁止 create_container，仅允许使用管理员预先创建好的容器（start/stop/logs）。
# 示例（禁止 alice 自行创建容器）：
#   - users: [alice]
#     actions: [create_container, ...]
# ─────────────────────────────────────────────────────────────────────────────

version: 1
default_action: allow

deny_rules:
  # ── test-sudo：sudo 组成员，禁止推送镜像和插件管理 ──────────────────────────
  - users: [test-sudo]
    actions: [push, plugin]

  # ── test-docker-g：docker 组成员，禁止构建/推送/提交/导入导出 ──────────────
  - users: [test-docker-g]
    actions: [build, push, commit, load, save, plugin]

  # ── bob：普通开发者，无禁止操作 ────────────────────────────────────────────
  - users: [bob]
    actions: []

  # ── alice：受限用户，无禁止操作 ────────────────────────────────────────────
  - users: [alice]
    actions: []


# ══════════════════════════════════════════════════════════════════════════════
# 操作别名展开说明
# ──────────────────────────────────────────────────────────────────────────────
# deny_rules 中的 actions 支持以下别名，代理会自动展开为对应的子操作：
#
#   run     →  create_container + start          (docker run 拆分为两步)
#   swarm   →  swarm_init + swarm_join + swarm_leave + swarm_update +
#              swarm_unlock + swarm_inspect +
#              node_ls + node_inspect + node_update + node_rm +
#              service_ls + service_create + service_inspect + service_update +
#              service_rm + service_logs +
#              task_ls + task_inspect +
#              secret_ls + secret_create + secret_inspect + secret_update + secret_rm +
#              config_ls + config_create + config_inspect + config_update + config_rm
#   secret  →  secret_ls + secret_create + secret_inspect + secret_update + secret_rm
#   config  →  config_ls + config_create + config_inspect + config_update + config_rm
#   plugin  →  plugin_ls + plugin_inspect + plugin_install + plugin_rm +
#              plugin_enable + plugin_disable + plugin_upgrade +
#              plugin_set + plugin_push + plugin_create
#
# 如需细粒度控制，可直接使用子操作名。例如：
#   仅禁止 service_create，但允许 service_ls/inspect/logs：
#     actions: [service_create]
#   禁止集群管理，但允许普通用户操作自己的 service/secret/config：
#     actions: [swarm_init, swarm_join, swarm_leave, swarm_update, swarm_unlock,
#              node_update, node_rm]
# ══════════════════════════════════════════════════════════════════════════════

# ⚠️  注意：以下 action_mapping 节仅为文档说明用途，不被程序读取。
#     实际的 HTTP 路径分类由代码中的 ClassifyAction() 函数硬编码实现
#     （internal/authz/policy.go），修改此节不会改变代理的行为。
# ──────────────────────────────────────────────────────────────────────────────
# 操作分类映射（文档参考，程序不读取此节）
action_mapping:
  # ── 容器操作 ──────────────────────────────────────────────────────────────
  ps:               ["GET /containers/json"]
  create_container: ["POST /containers/create"]
  start:            ["POST /containers/{id}/start"]
  restart:          ["POST /containers/{id}/restart"]
  stop:             ["POST /containers/{id}/stop"]
  kill:             ["POST /containers/{id}/kill"]
  pause:            ["POST /containers/{id}/pause"]
  unpause:          ["POST /containers/{id}/unpause"]
  rm:               ["DELETE /containers/{id}"]
  exec:             ["POST /containers/{id}/exec", "POST /containers/{id}/attach",
                     "POST /exec/{id}/start", "POST /exec/{id}/resize"]
  inspect:          ["GET /containers/{id}/json", "GET /images/{id}/json",
                     "GET /exec/{id}/json"]
  logs:             ["GET /containers/{id}/logs", "GET /containers/{id}/stats",
                     "GET /containers/{id}/top"]
  cp:               ["GET /containers/{id}/archive", "PUT /containers/{id}/archive",
                     "GET /containers/{id}/export"]
  commit:           ["POST /commit"]

  # ── 镜像操作 ──────────────────────────────────────────────────────────────
  images:  ["GET /images/json"]
  pull:    ["POST /images/create"]
  load:    ["POST /images/load"]
  save:    ["GET /images/{name}/get", "GET /images/get"]
  build:   ["POST /build", "POST /images/build"]
  push:    ["POST /images/{name}/push"]
  rmi:     ["DELETE /images/{name}"]
  tag:     ["POST /images/{name}/tag"]
  search:  ["GET /images/search"]

  # ── 清理操作 ──────────────────────────────────────────────────────────────
  prune:   ["POST /containers/prune", "POST /images/prune",
            "POST /volumes/prune", "POST /networks/prune",
            "POST /build/prune", "POST /system/prune"]

  # ── 网络操作 ──────────────────────────────────────────────────────────────
  network_ls:         ["GET /networks"]
  network_inspect:    ["GET /networks/{id}"]
  network_create:     ["POST /networks/create"]
  network_connect:    ["POST /networks/{id}/connect"]
  network_disconnect: ["POST /networks/{id}/disconnect"]
  network_rm:         ["DELETE /networks/{id}"]

  # ── 卷操作 ────────────────────────────────────────────────────────────────
  volume_ls:      ["GET /volumes"]
  volume_inspect: ["GET /volumes/{name}"]
  volume_create:  ["POST /volumes/create"]
  volume_rm:      ["DELETE /volumes/{name}"]

  # ── 系统操作 ──────────────────────────────────────────────────────────────
  info:    ["GET /info"]
  version: ["GET /version"]
  df:      ["GET /system/df"]
  events:  ["GET /events"]
  login:   ["POST /auth"]

  # ── Swarm 集群管理 ────────────────────────────────────────────────────────
  # 别名 "swarm" 展开为以下所有子操作（含 node/service/task/secret/config）
  swarm_inspect:  ["GET /swarm"]
  swarm_init:     ["POST /swarm/init"]
  swarm_join:     ["POST /swarm/join"]
  swarm_leave:    ["POST /swarm/leave"]
  swarm_update:   ["POST /swarm/update"]
  swarm_unlock:   ["POST /swarm/unlock"]

  # ── Node 节点管理 ─────────────────────────────────────────────────────────
  node_ls:      ["GET /nodes"]
  node_inspect: ["GET /nodes/{id}", "GET /nodes/{id}/json"]
  node_update:  ["POST /nodes/{id}/update"]
  node_rm:      ["DELETE /nodes/{id}"]

  # ── Service 服务管理 ──────────────────────────────────────────────────────
  service_ls:      ["GET /services"]
  service_create:  ["POST /services/create"]
  service_inspect: ["GET /services/{id}"]
  service_update:  ["POST /services/{id}/update"]
  service_rm:      ["DELETE /services/{id}"]
  service_logs:    ["GET /services/{id}/logs"]

  # ── Task 任务管理 ─────────────────────────────────────────────────────────
  task_ls:      ["GET /tasks"]
  task_inspect: ["GET /tasks/{id}"]

  # ── Secret 密钥管理（别名 "secret" 展开为以下子操作）──────────────────────
  secret_ls:      ["GET /secrets"]
  secret_create:  ["POST /secrets/create"]
  secret_inspect: ["GET /secrets/{id}"]
  secret_update:  ["POST /secrets/{id}/update"]
  secret_rm:      ["DELETE /secrets/{id}"]

  # ── Config 配置管理（别名 "config" 展开为以下子操作）──────────────────────
  config_ls:      ["GET /configs"]
  config_create:  ["POST /configs/create"]
  config_inspect: ["GET /configs/{id}"]
  config_update:  ["POST /configs/{id}/update"]
  config_rm:      ["DELETE /configs/{id}"]

  # ── 插件操作（细粒度）────────────────────────────────────────────────────────
  # 使用 "plugin" 可一次性禁止所有插件操作（等价于列出所有子操作）
  plugin:         ["plugin_ls", "plugin_inspect", "plugin_install", "plugin_rm",
                   "plugin_enable", "plugin_disable", "plugin_upgrade",
                   "plugin_set", "plugin_push", "plugin_create"]
  plugin_ls:      ["GET /plugins"]
  plugin_inspect: ["GET /plugins/{name}/json"]
  plugin_install: ["POST /plugins/pull"]
  plugin_rm:      ["DELETE /plugins/{name}"]
  plugin_enable:  ["POST /plugins/{name}/enable"]
  plugin_disable: ["POST /plugins/{name}/disable"]
  plugin_upgrade: ["POST /plugins/{name}/upgrade"]
  plugin_set:     ["POST /plugins/{name}/set"]
  plugin_push:    ["POST /plugins/{name}/push"]
  plugin_create:  ["POST /plugins/create"]

  # ── Secret / Config ───────────────────────────────────────────────────────
  secret:  ["/secrets/*"]
  config:  ["/configs/*"]
