# docker-authz-proxy 审计日志 logrotate 配置
# 安装：cp deploy/logrotate.conf /etc/logrotate.d/docker-authz

# 用户操作日志（/var/log/docker-authz/user-operation/）
/var/log/docker-authz/user-operation/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    sharedscripts
    postrotate
        # 通知代理重新打开日志文件（SIGUSR1 触发 Reopen）
        if [ -f /run/docker-authz-proxy.pid ]; then
            kill -USR1 $(cat /run/docker-authz-proxy.pid) 2>/dev/null || true
        fi
    endscript
}

