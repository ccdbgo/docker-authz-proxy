# docker-authz-proxy 跨用户网络互通配置
# 版本：1
#
# 说明：
#   默认情况下，每个用户只能访问自己创建的网络（名称前缀为 <username>_u<uid>_）。
#   本配置文件允许 root 管理员设置共享网络，授权特定用户互通。
#
# 共享网络的创建方式：
#   root 执行 docker network create 时，网络名称不会加前缀（root 创建的网络无前缀）。
#   然后通过本配置文件或管理工具将该网络设置为共享，并授权用户访问。
#
# 注意：本配置文件目前为文档说明用途。
#       实际的网络共享授权通过以下方式实现：
#       1. root 创建网络后，使用管理工具：
#          docker-authz-admin network share <network_id> --users alice,bob
#       2. 或在代理数据库中直接操作 network_access 表

version: 1

# 共享网络配置示例
# shared_networks:
#   - name: "shared_lab"           # 共享网络名（由 root 预先创建）
#     allowed_users: [alice, bob]  # 允许这些用户连接/使用该网络
#
#   - name: "team_net"
#     allowed_groups: [devteam]    # 按组授权（组内所有用户均可访问）
